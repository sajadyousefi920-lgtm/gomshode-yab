<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گمشده‌یاب</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            font-size: 32px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
        }

        .lost {
            background: #e53935;
            color: white;
        }

        .found {
            background: #43a047;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔎 گمشده‌یاب</h1>

    <p>وسیله‌ای گم کردی یا چیزی پیدا کردی؟</p>

    <button class="lost">
        🔴 وسیله‌ام گم شده
    </button>

    <button class="found">
        🟢 وسیله‌ای پیدا کردم
    </button>

</div>

</body>
</html>
